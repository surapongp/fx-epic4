name: Deploy to Cloudflare Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create Pages project (if not exists)
        run: |
          RESPONSE=$(curl -s -o /tmp/cf_create.json -w "%{http_code}" -X POST \
            "https://api.cloudflare.com/client/v4/accounts/710091e64c44d183a1a5465456d88ff1/pages/projects" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            -H "Content-Type: application/json" \
            -d '{"name":"fx-epic4","production_branch":"master"}')
          echo "HTTP $RESPONSE: $(cat /tmp/cf_create.json)"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Deploy to Cloudflare Pages
        run: npx wrangler pages deploy . --project-name fx-epic4 --branch master
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 710091e64c44d183a1a5465456d88ff1
